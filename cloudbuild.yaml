options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'python:3.12-slim'
    entrypoint: bash
    args: ['-c', 'pip install -r requirements.txt && pytest test_app.py -v']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/REPO_NAME/JOB_NAME', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/REPO_NAME/JOB_NAME']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'JOB_NAME'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/REPO_NAME/JOB_NAME'
      - '--region=us-central1'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'JOB_NAME'
      - '--region=us-central1'
      - '--wait'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/REPO_NAME/JOB_NAME'

